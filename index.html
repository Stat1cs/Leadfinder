<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Arabic is the default indexed language (leadfinder.om). The language
         toggle flips lang/dir client-side; see src/i18n/LanguageContext.tsx. -->
    <!-- Title, description, favicon, Open Graph and the brand colour theme are
         injected from Layout + the i18n dictionary and baked into static HTML. -->
    <!-- Manrope (Tidal / English) via Google Fonts. Arabic: Almarai for body
         text, IBM Plex Sans Arabic for headlines — both self-hosted in
         /public/fonts (see styles.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="/fonts/almarai-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-arabic-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
